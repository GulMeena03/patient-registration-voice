services:
  - type: web
    name: patient-registration-voice
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SEED_ON_START
        value: "true"
      - key: VAPI_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: patients-db
          property: connectionString
databases:
  - name: patients-db
    plan: free
